/* ---------- renderer / scene ---------- */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
(function sky(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  [[0,'#0b2a66'],[.4,'#2f62b8'],[.7,'#8fb4e0'],[.9,'#e8c9a4'],[1,'#f2b27a']].forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
})();
scene.fog = new THREE.FogExp2(0x9db8dc, .00075);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), .04).texture;
scene.environmentIntensity = .6;
const camera = new THREE.PerspectiveCamera(40, 1, .5, 6000);
const controls = new OrbitControls(camera, canvas);
window.__dbg = {camera, controls, scene};
controls.enableDamping = true; controls.dampingFactor = .06; controls.rotateSpeed = .55; controls.zoomSpeed = .8; controls.enablePan = false;
controls.minDistance = 12; controls.maxDistance = 420; controls.maxPolarAngle = Math.PI*.495;
const hemi = new THREE.HemisphereLight(0xbfd6ff, 0x4a3a2a, .9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd6a0, 1.5); sun.position.set(-120, 90, 160); scene.add(sun);
const skyBG = scene.background, fogObj = scene.fog;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, {type:THREE.HalfFloatType, samples:0}));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), .35, .6, .92); composer.addPass(bloom); composer.addPass(new OutputPass());

/* ---------- model ---------- */
let model = null;
const draco = new DRACOLoader(); draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const loaded = new Promise((res, rej) => loader.load('models/hotel_site.glb', g => {
  model = g.scene;
  model.traverse(o => {
    if (/^(Slabs|Deck_|Roof_|Garage_Bays)/.test(o.name)) { o.visible = false; return; }
    if (o.isMesh && /^CurtainGlass/.test(o.name)) { o.material = new THREE.MeshStandardMaterial({color: 0x9fb8c4, roughness: .05, metalness: .3, transparent: true, opacity: .22, depthWrite: false}); return; }
    if (!o.isMesh) return;
    const m = o.material; if (!m) return;
    m.envMapIntensity = .7; if (m.name === 'RiverWater') { m.roughness = .6; m.metalness = 0; }
    if (m.map && m.map.image && /leaf/i.test(m.name || '')) { m.alphaTest = .5; m.transparent = false; m.side = THREE.DoubleSide; }
    if (m.transparent) m.depthWrite = false;
    if (m.emissive && m.emissiveIntensity > 0 && (m.emissive.r + m.emissive.g + m.emissive.b) > 0) { m.emissiveIntensity = Math.min(m.emissiveIntensity, 6); }
  });
  scene.add(model); res();
}, xhr => { if (xhr.total) $('#loading').textContent = 'Loading model ' + Math.round(xhr.loaded/xhr.total*100) + '%'; }, rej));

/* ---------- camera moves ---------- */
let tw = null; const ease = t => t < .5 ? 8*t*t*t*t : 1 - Math.pow(-2*t + 2, 4)/2;
function fly(pos, tgt, dur = 2600, arc = 0){
  return new Promise(res => {
    if (tw) tw.res(); controls.enabled = false;
    tw = {t0:performance.now(), dur, p0:camera.position.clone(), g0:controls.target.clone(), p1:pos.clone(), g1:tgt.clone(), arc, res};
    $('#hotspots').classList.add('hide');
  });
}
function step(){
  if (!tw) return; const k = Math.min(1, (performance.now() - tw.t0)/tw.dur), e = ease(k);
  camera.position.lerpVectors(tw.p0, tw.p1, e); camera.position.y += Math.sin(Math.PI*e)*tw.arc;
  controls.target.lerpVectors(tw.g0, tw.g1, e); camera.lookAt(controls.target);
  if (k >= 1){ const r = tw.res; tw = null; controls.enabled = true; controls.update(); $('#hotspots').classList.remove('hide'); r(); }
}

/* ---------- hotspots ---------- */
const hsLayer = $('#hotspots'); const hsEls = [];
SPOTS.forEach(s => {
  const b = document.createElement('button'); b.className = 'hs always'; b.innerHTML = `${s.n}<span class="lb">${s.title}</span>`;
  b.onclick = e => { e.stopPropagation(); openSpot(s, b); }; hsLayer.appendChild(b); hsEls.push({el:b, s});
});
const tmp = new THREE.Vector3();
function updateHotspots(){
  const w = innerWidth, h = innerHeight;
  hsEls.forEach(({el, s}) => {
    tmp.copy(s.at).project(camera); const dist = camera.position.distanceTo(s.at);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05 && dist < 340;
    el.classList.toggle('off', !vis); el.style.left = ((tmp.x*.5 + .5)*w) + 'px'; el.style.top = ((-tmp.y*.5 + .5)*h) + 'px';
  });
}

function openSpot(s, btn){
  hsEls.forEach(({el}) => el.classList.remove('sel')); btn && btn.classList.add('sel'); cur = s; gi = 0;

    ${s.room ? `<button class="book" id="enter3d">${GUEST_KEYS.includes(s.room) ? 'View this floor plan' : 'View this room in 3D'}</button>` : ""}
    <button class="book" id="enq">Enquire about this space</button>`;
  const show = i => { gi = (i + s.imgs.length) % s.imgs.length; $('#gimg').src = s.imgs[gi]; drawer.querySelectorAll('.th img').forEach((t, j) => t.classList.toggle('on', j === gi)); };
  drawer.querySelectorAll('.th img').forEach(t => t.onclick = () => show(+t.dataset.i));
  const pv = $('#pv'), nx = $('#nx'); if (pv) { pv.onclick = () => show(gi - 1); nx.onclick = () => show(gi + 1); }
  drawer.querySelector('.x').onclick = closeSpot; { const e3 = $('#enter3d'); if (e3) e3.onclick = () => { const M = {lobby:['G','Lobby & Reception'], restaurant:[2,'All-Day Dining'], gym:[3,'Fitness & Spa'], rooftop:[18,'Rooftop Bar & Pool'], deluxe:[6,'Deluxe King'], club:[11,'Club Rooms'], suite:[15,'Executive Suites'], sky:[17,'Sky Suites']}[s.room]; openFloor(M[0], s.room, M[1]); };; } $('#enq').onclick = () => { $('#enq').textContent = 'Concierge  02-000-0000'; };
  drawer.classList.add('on'); document.body.classList.add('roomopen');
}
function closeSpot(){ drawer.classList.remove('on'); document.body.classList.remove('roomopen'); hsEls.forEach(({el}) => el.classList.remove('sel')); cur = null; }
async function goView(v){

}

    setI(LIFE.pBody, i, x, 1.0 + bob, z, 0); setI(LIFE.pHead, i, x, 1.72 + bob, z, 0); });
  LIFE.pBody.instanceMatrix.needsUpdate = true; LIFE.pHead.instanceMatrix.needsUpdate = true;
}

/* ---------- loop / boot ---------- */
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function tick(){ step(); walk(); lifeUpdate(); if (TOWER) { TOWER.update(performance.now() / 1000); TOWER.lod(camera); } if (!LOOK.on) controls.update(); updateHotspots(); composer.render(); requestAnimationFrame(tick); }
$('#brand').innerHTML = `${NAME}<small>โรงแรม 5 ดาว 18 ชั้น</small>`; $('#iw').textContent = NAME;
camera.position.copy(BL(-40, -70, 6)); controls.target.copy(BL(0, -14, 14)); camera.lookAt(controls.target); controls.enabled = false;
tick();
(async () => {
  await Promise.all([loaded.catch(e => { $('#loading').textContent = 'Model failed to load: ' + e.message; throw e; }), sleep(2600)]);
  buildLife(); TOWER = buildTower(scene); buildParking(scene); $('#loading').style.opacity = 0; $('#intro').classList.add('out'); await sleep(500);
  await fly(VIEWS.aerial.pos, VIEWS.aerial.tgt, 5200, 10);
})();
</script>
